postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  database: ecommerce
  port: 5432
  existingSecret: postgres-credentials
  secretKeys:
    username: username
    password: password
  storage:
    size: 20Gi
    storageClassName: gp3


redis:
  enabled: true
  image:
    repository: redis
    tag: "7"
  port: 6379
  storage:
    size: 10Gi
    storageClassName: gp3

ingress:
  enabled: true
  className: traefik
  host: ecommerce.ahmedo.co.uk
  tls:
    enabled: true
    secretName: ecommerce-tls
