global:
  namespace: ecommerce
  environment: prod
  awsRegion: eu-west-2
  domain: ecommerce.ahmedo.co.uk
  ecrRegistry: 409987738946.dkr.ecr.eu-west-2.amazonaws.com
  imagePullPolicy: IfNotPresent
  secretProvider: vault

services:
  api-gateway:
    enabled: true
    replicas: 2
    image:
      repository: api-gateway
      tag: "27096639748"
    containerPort: 8080
    servicePort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 5
        targetCPUUtilizationPercentage: 70

  order-service:
    enabled: true
    replicas: 2
    image:
      repository: order-service
      tag: "27096639748"
    containerPort: 8081
