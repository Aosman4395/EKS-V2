{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: ecommerce
    spec:
      serviceAccountName: ecommerce-service-account
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.ecrRegistry }}/{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
              protocol: TCP
          envfrom:
            - configMapRef:
                name:ecommerce-config
          startupProbe:
            httpGet:
              path: /health
              port: {{ $svc.containerPort }}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml $svc.resources | indent 12 }}
---
{{- end }}
{{- end }}