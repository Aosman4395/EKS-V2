apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 37.1.0

    helm:
      valueFiles:
        - $values/addons/traefik-values.yaml

  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 37.1.0

    - repoURL: https://github.com/Aosman4395/EKS-V2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true