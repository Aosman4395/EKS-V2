name: Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/tf-plan-apply.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d terraform --framework terraform \
            --skip_check: CKV_AWS_38,CKV_AWS_39,CKV_AWS_382,CKV_AWS_130,CKV2_AWS_11,CKV2_AWS_12,CKV_AWS_58

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./terraform/prod
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/prod
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform/prod/tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/prod
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform/prod

      - name: Terraform Apply
        working-directory: ./terraform/prod
        run: terraform apply -auto-approve -lock-timeout=5m tfplan

 #